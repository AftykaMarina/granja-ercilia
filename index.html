/* ---------- Gráficos temporales para el PDF ---------- */
function chartImageOffscreen(type, config, w, h) {
  if (typeof Chart === 'undefined') return null;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const chart = new Chart(canvas.getContext('2d'), Object.assign({ type }, config));
  const img = chart.toBase64Image('image/png', 1);
  chart.destroy();
  return img;
}

/* ---------- Exportar PDF ---------- */
async function exportarPDF(desde, hasta) {
  try {
  const lista = filtrarRango(desde, hasta);
  const agg = agregados(lista);
  const rotosPct = agg.total ? (agg.rotos / agg.total) * 100 : 0;
  if (!window.jspdf || !window.jspdf.jsPDF) { toast('Error: librería PDF no disponible. Verificá la conexión a internet.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const marginX = 42;

  /* Header oscuro con neon */
  doc.setFillColor(13, 27, 42);
  doc.rect(0, 0, pageW, 86, 'F');
  doc.setTextColor(0, 212, 255);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(20);
  doc.text('Granja Ercilia', marginX, 40);
  doc.setTextColor(226, 232, 240);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
  doc.text('Reporte de producci\u00f3n de huevos', marginX, 60);
  doc.text('Per\u00edodo: ' + fmtDateLong(desde) + '  al  ' + fmtDateLong(hasta), marginX, 76);

  let y = 116;
  doc.setTextColor(226, 232, 240);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
  doc.text('Resumen', marginX, y);
  y += 10;

  const resumenBody = [
    ['Total recolectado', num(agg.total)],
    ['Peque\u00f1os', num(agg.pequenos)],
    ['Medianos', num(agg.medianos)],
    ['Grandes', num(agg.grandes)],
    ['Extra grandes', num(agg.extraGrandes)],
    ['Rotos', num(agg.rotos) + ' (' + pct(rotosPct) + ')'],
    ['Sucios / descartados', num(agg.sucios)],
    ['D\u00edas con registro', String(diasConDatos(lista))]
  ];
  const ppPdf = picoPostura(agg.total);
  if (ppPdf !== null) resumenBody.push(['Pico de postura', pct(ppPdf) + ' huevos/gallinas']);
  doc.autoTable({
    startY: y, margin: { left: marginX, right: marginX },
    head: [['Indicador', 'Valor']], body: resumenBody,
    theme: 'plain', styles: { font: 'helvetica', fontSize: 10, textColor: [226, 232, 240], cellPadding: 5 },
    headStyles: { fillColor: [13, 27, 42], textColor: [0, 212, 255], fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [20, 30, 50] },
    bodyStyles: { fillColor: [17, 24, 39] }
  });

  y = doc.lastAutoTable.finalY + 24;
  if (agg.total) {
    let barImg = null, pieImg = null;
    try {
      barImg = chartImageOffscreen('bar', {
        data: { labels: SIZE_KEYS.map(k => SIZE_LABELS[k]), datasets: [{ data: SIZE_KEYS.map(k => agg[k]), backgroundColor: SIZE_KEYS.map(k => SIZE_COLORS[k]), borderColor: SIZE_KEYS.map(k => SIZE_COLORS[k]), borderWidth: 1 }] },
        options: { responsive: false, animation: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#94A3B8' }, grid: { display: false } }, y: { ticks: { color: '#94A3B8' }, grid: { color: 'rgba(255,255,255,0.06)' }, beginAtZero: true } } }
      }, 560, 320);
      pieImg = chartImageOffscreen('doughnut', {
        data: { labels: SIZE_KEYS.map(k => SIZE_LABELS[k]), datasets: [{ data: SIZE_KEYS.map(k => agg[k]), backgroundColor: SIZE_KEYS.map(k => SIZE_COLORS[k]), borderColor: '#0D1B2A', borderWidth: 2 }] },
        options: { responsive: false, animation: false, plugins: { legend: { position: 'bottom', labels: { color: '#94A3B8' } } } }
      }, 560, 380);
    } catch(e) { console.warn('Error generando gr\u00e1ficos PDF:', e); }

    if (y > 620) { doc.addPage(); y = 40; }
    doc.setTextColor(226, 232, 240);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
    doc.text('Clasificaci\u00f3n por tama\u00f1o', marginX, y);
    y += 10;
    if (barImg && pieImg) {
      const imgW = (pageW - marginX * 2 - 16) / 2;
      doc.addImage(barImg, 'PNG', marginX, y, imgW, imgW * (320 / 560));
      doc.addImage(pieImg, 'PNG', marginX + imgW + 16, y, imgW, imgW * (380 / 560));
      y += imgW * (320 / 560) + 26;
    }
  }

  const porDia = {};
  lista.forEach(r => {
    porDia[r.fecha] = porDia[r.fecha] || { total: 0, rotos: 0, sucios: 0 };
    porDia[r.fecha].total += totalRegistro(r);
    porDia[r.fecha].rotos += Number(r.rotos) || 0;
    porDia[r.fecha].sucios += Number(r.sucios) || 0;
  });
  const diasOrdenados = Object.keys(porDia).sort();
  if (diasOrdenados.length) {
    if (y > 680) { doc.addPage(); y = 40; }
    doc.setTextColor(226, 232, 240);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
    doc.text('Detalle por d\u00eda', marginX, y);
    y += 8;
    doc.autoTable({
      startY: y, margin: { left: marginX, right: marginX },
      head: [['Fecha', 'Total', 'Rotos', 'Sucios']],
      body: diasOrdenados.map(d => [fmtDateShort(d), num(porDia[d].total), num(porDia[d].rotos), num(porDia[d].sucios)]),
      theme: 'striped', styles: { font: 'helvetica', fontSize: 9.5, cellPadding: 5, textColor: [226, 232, 240] },
      headStyles: { fillColor: [14, 165, 233], textColor: [255, 255, 255] },
      alternateRowStyles: { fillColor: [20, 30, 50] },
      bodyStyles: { fillColor: [17, 24, 39] }
    });
  }

  const totalPages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= totalPages; i++) {
    doc.setPage(i);
    doc.setFontSize(8.5); doc.setTextColor(148, 163, 184);
    doc.text('Generado el ' + fmtDateLong(todayStr()) + ' \u00b7 Granja Ercilia', marginX, doc.internal.pageSize.getHeight() - 20);
  }

  doc.save('granja-ercilia-reporte_' + desde + '_a_' + hasta + '.pdf');
  toast('PDF generado \u2713');
  } catch(e) { console.error('Error exportarPDF:', e); toast('Error al generar PDF: ' + e.message); }
}

/* ---------- Exportar Excel ---------- */
function exportarExcel(desde, hasta) {
  const lista = filtrarRango(desde, hasta).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  const agg = agregados(lista);
  const rotosPct = agg.total ? (agg.rotos / agg.total) * 100 : 0;

  const filasRegistros = lista.map(r => {
    const g = state.galpones.find(g => g.id === r.galponId);
    return {
      Fecha: r.fecha, Hora: r.hora, Galpón: g ? g.nombre : '', Pequeños: r.pequenos, Medianos: r.medianos,
      Grandes: r.grandes, 'Extra grandes': r.extraGrandes, Rotos: r.rotos, 'Sucios/Descartados': r.sucios,
      Total: totalRegistro(r), Usuario: r.usuario, Observaciones: r.observaciones
    };
  });
  const resumen = [
    { Indicador: 'Período', Valor: desde + ' a ' + hasta },
    { Indicador: 'Total recolectado', Valor: agg.total },
    { Indicador: 'Pequeños', Valor: agg.pequenos },
    { Indicador: 'Medianos', Valor: agg.medianos },
    { Indicador: 'Grandes', Valor: agg.grandes },
    { Indicador: 'Extra grandes', Valor: agg.extraGrandes },
    { Indicador: 'Rotos', Valor: agg.rotos },
    { Indicador: '% Rotos', Valor: Number(rotosPct.toFixed(2)) },
    { Indicador: 'Sucios/Descartados', Valor: agg.sucios },
    { Indicador: 'Días con registro', Valor: diasConDatos(lista) }
  ];
  const ppExcel = picoPostura(agg.total);
  if (ppExcel !== null) resumen.push({ Indicador: 'Pico de postura (%)', Valor: Number(ppExcel.toFixed(2)) });

  const wb = XLSX.utils.book_new();
  const wsResumen = XLSX.utils.json_to_sheet(resumen);
  const wsRegistros = XLSX.utils.json_to_sheet(filasRegistros);
  XLSX.utils.book_append_sheet(wb, wsResumen, 'Resumen');
  XLSX.utils.book_append_sheet(wb, wsRegistros, 'Registros');
  XLSX.writeFile(wb, 'granja-ercilia-reporte_' + desde + '_a_' + hasta + '.xlsx');
  toast('Excel generado ✓');
}

/* ---------- Perfil (rol) / respaldo ---------- */
let mostrarFormNube = false;
function renderPerfilModal() {
  const modal = document.getElementById('modalPerfil');
  const conectado = !!db;
  modal.innerHTML =
    '<div class="modalCard">' +
      '<div class="modalCard__head"><h3>Perfil y ajustes</h3><button class="iconBtn" id="cerrarPerfil">' + ICONS.x + '</button></div>' +
      '<label class="field"><span>Nombre (opcional)</span><input type="text" id="p_nombre" value="' + escapeHtml(state.perfil.nombre) + '" placeholder="Tu nombre"></label>' +
      '<label class="field"><span>Rol</span><select id="p_rol">' +
        ['Administrador', 'Supervisor', 'Operario'].map(r => '<option value="' + r + '"' + (state.perfil.rol === r ? ' selected' : '') + '>' + r + '</option>').join('') +
      '</select></label>' +
      '<p class="modalNote">El rol define qué secciones podés usar. Administrador: todo. Supervisor: ver e informar. Operario: registrar producción.</p>' +
      '<button class="btn btn--primary" id="guardarPerfil">Guardar</button>' +
      '<div class="divider"></div>' +
      '<h4 class="modalSubhead">Sincronización en tiempo real</h4>' +
      (conectado ?
        '<div class="alertCard alertCard--ok2">' + ICONS.check + '<span>Conectado a la nube. Todo el equipo ve los mismos datos al instante, desde su propio celular.</span></div>' +
        '<button class="btn btn--ghost" id="btnDesconectarNube">Desconectar de la nube</button>'
      :
        '<p class="modalNote">Ahora mismo esta app guarda los datos ' + (window.storage ? 'dentro de este chat de Claude' : 'solo en este dispositivo') + '. Para que todo el equipo cargue desde su propio celular y vea lo mismo en tiempo real, conectá una base de datos gratuita (Firebase). Tardás unos 5 minutos.</p>' +
        (mostrarFormNube ?
          '<ol class="modalSteps">' +
            '<li>Entrá a <strong>console.firebase.google.com</strong> con una cuenta de Google.</li>' +
            '<li>Creá un proyecto (podés llamarlo "granja-ercilia"), sin habilitar Google Analytics.</li>' +
            '<li>En el menú izquierdo entrá a <strong>Compilación → Firestore Database</strong> y creá una base de datos, en <strong>modo de prueba</strong>.</li>' +
            '<li>Andá a <strong>Configuración del proyecto</strong> (ícono ⚙ arriba a la izquierda) → sección "Tus apps" → creá una app <strong>Web</strong> (ícono &lt;/&gt;), con cualquier nombre.</li>' +
            '<li>Copiá el objeto <code>firebaseConfig</code> que te muestra y pegalo acá abajo, tal cual.</li>' +
          '</ol>' +
          '<label class="field"><span>Configuración de Firebase (pegar el objeto firebaseConfig)</span><textarea id="p_cloudcfg" rows="6" placeholder=\'{ apiKey: "...", authDomain: "...", projectId: "...", ... }\'></textarea></label>' +
          '<button class="btn btn--secondary" id="btnConectarNube">Conectar</button>'
        : '<button class="btn btn--ghost" id="btnMostrarNube">Configurar sincronización en la nube</button>')
      ) +
      '<div class="divider"></div>' +
      '<h4 class="modalSubhead">Respaldo de datos</h4>' +
      '<p class="modalNote">Además de lo anterior, podés exportar en cualquier momento una copia manual de todos los registros.</p>' +
      '<div class="modalRow"><button class="btn btn--ghost" id="btnExportarRespaldo">Descargar copia (.json)</button>' +
      '<label class="btn btn--ghost" id="btnImportarRespaldo">Restaurar copia<input type="file" id="fileRespaldo" accept="application/json" hidden></label></div>' +
    '</div>';

  const btnMostrarNube = document.getElementById('btnMostrarNube');
  if (btnMostrarNube) btnMostrarNube.addEventListener('click', () => { mostrarFormNube = true; renderPerfilModal(); });
  const btnConectarNube = document.getElementById('btnConectarNube');
  if (btnConectarNube) btnConectarNube.addEventListener('click', async () => {
    const texto = document.getElementById('p_cloudcfg').value;
    const cfg = parseFirebaseConfigInput(texto);
    if (!cfg || !cfg.apiKey || !cfg.projectId) { toast('No pude leer esa configuración. Revisá que sea el objeto completo copiado de Firebase.'); return; }
    btnConectarNube.textContent = 'Conectando...'; btnConectarNube.disabled = true;
    try {
      await initCloud(cfg);
      saveCloudConfig(cfg);
      toast('¡Conectado! Sincronizando datos del equipo...');
      setTimeout(() => location.reload(), 600);
    } catch (e) {
      toast('No se pudo conectar. Revisá el modo de prueba de Firestore y que el texto esté completo.');
      btnConectarNube.textContent = 'Conectar'; btnConectarNube.disabled = false;
    }
  });
  const btnDesconectarNube = document.getElementById('btnDesconectarNube');
  if (btnDesconectarNube) btnDesconectarNube.addEventListener('click', () => {
    if (!confirm('Esto desconecta este dispositivo de la nube y vuelve al modo local. ¿Continuar?')) return;
    clearCloudConfig();
    location.reload();
  });

  document.getElementById('cerrarPerfil').addEventListener('click', cerrarPerfil);
  document.getElementById('guardarPerfil').addEventListener('click', async () => {
    state.perfil.nombre = document.getElementById('p_nombre').value.trim();
    state.perfil.rol = document.getElementById('p_rol').value;
    await storeSet('perfil', JSON.stringify(state.perfil), false);
    renderNav();
    if (!canAccess(state.activeTab)) setTab('inicio'); else renderCurrentView();
    toast('Perfil actualizado');
    cerrarPerfil();
  });
  document.getElementById('btnExportarRespaldo').addEventListener('click', () => {
    const data = JSON.stringify({ registros: state.registros, galpones: state.galpones, pedidos: state.pedidos, exportadoEn: new Date().toISOString() }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'granja-ercilia-respaldo_' + todayStr() + '.json';
    a.click();
  });
  document.getElementById('fileRespaldo').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (Array.isArray(data.registros) && Array.isArray(data.galpones)) {
        await restaurarDatos(data.registros, data.galpones, data.pedidos || []);
        toast('Respaldo restaurado ✓');
        cerrarPerfil();
        renderCurrentView();
      } else {
        toast('El archivo no parece un respaldo válido.');
      }
    } catch (err) { toast('Error al leer el respaldo'); }
  });
}

function abrirPerfil() {
  renderPerfilModal();
  document.getElementById('modalPerfil').classList.add('modal--open');
}
function cerrarPerfil() {
  document.getElementById('modalPerfil').classList.remove('modal--open');
}

/* ---------- Cargar datos iniciales ---------- */
async function cargarDatos() {
  const cfg = loadCloudConfig();
  if (cfg) {
    try {
      await initCloud(cfg);
      setupListeners();
    } catch (e) {
      console.warn('Error al iniciar Firebase con config guardada, volviendo a local:', e);
      clearCloudConfig();
      await cargarDatosLocales();
    }
  } else {
    await cargarDatosLocales();
  }

  const p = await storeGet('perfil', false);
  if (p) { try { state.perfil = Object.assign(state.perfil, JSON.parse(p)); } catch (e) {} }

  renderNav();
  setTab('inicio');
}

async function cargarDatosLocales() {
  const r = await storeGet('registros', true);
  if (r) { try { state.registros = JSON.parse(r); } catch (e) {} }
  const g = await storeGet('galpones', true);
  if (g) { try { state.galpones = JSON.parse(g); } catch (e) {} }
  const pd = await storeGet('pedidos', true);
  if (pd) { try { state.pedidos = JSON.parse(pd); } catch (e) {} }
  if (!state.galpones.length) {
    state.galpones = [{ id: 'g_default', nombre: 'Galpón 1', capacidad: 0 }];
    await guardarGalponesLocal();
  }
}

/* Global error handler — muestra errores como toast para depuración */
window.onerror = function(msg, src, line, col, err) {
  console.error('Global error:', msg, src, line, col, err);
  try { toast('⚠ Error L' + line + ': ' + msg); } catch(e) {}
};
window.addEventListener('unhandledrejection', function(ev) {
  console.error('Unhandled promise:', ev.reason);
  try { toast('⚠ Async error: ' + (ev.reason && ev.reason.message || ev.reason)); } catch(e) {}
});

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btnPerfil').addEventListener('click', abrirPerfil);
  cargarDatos().catch(e => {
    console.error('Error al cargar datos:', e);
    try { toast('Error al cargar datos: ' + e.message); } catch(e2) {}
    try { renderNav(); setTab('inicio'); } catch(e2) { console.error('Fallback render failed:', e2); }
  });
});
</script>

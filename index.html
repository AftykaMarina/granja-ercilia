/* ---------- Caja y rentabilidad ---------- */
const CATEGORIAS_GASTO = ['Alimento', 'Sanidad', 'Envases', 'Operativos', 'Mano de obra', 'Impuestos', 'Otros'];
const TIPO_GASTO_LABEL = { MENSUAL: 'Todos los meses', UNICO: 'Solo este mes', MAPLE: 'Por maple' };

function money(n) { return '$ ' + num(Math.round(Number(n) || 0)); }
function mesActualKey() { return todayStr().slice(0, 7); }
function shiftMes(mes, delta) {
  const partes = mes.split('-').map(Number);
  const d = new Date(partes[0], partes[1] - 1 + delta, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
}
function ultimoDiaMes(mes) {
  const p = mes.split('-').map(Number);
  const d = new Date(p[0], p[1], 0);
  return mes + '-' + pad2(d.getDate());
}
function fechaIngresoPedido(pd) { return pd.fechaEntrega || pd.fechaPago || pd.fechaNecesaria || pd.fechaReserva || pd.fecha || ''; }
function maplesDePedido(pd) {
  if (pd.producto !== 'HUEVOS') return 0;
  if (pd.presentacion === 'MAPLE') return Number(pd.cantidadPresentacion) || 0;
  return (Number(pd.cantidadUnidadesBase) || 0) / 30;
}
function precioSugerido(maples) {
  const p = state.precios || { uno: 9000, dos: 17000, tresMas: 8000 };
  const n = Math.max(1, Math.floor(Number(maples) || 0));
  if (n === 1) return Number(p.uno) || 0;
  if (n === 2) return Number(p.dos) || 0;
  return n * (Number(p.tresMas) || 0);
}
function registrosProduccionMes(mes) {
  return (state.registros || []).filter(r => (r.fecha || '').indexOf(mes) === 0);
}
function huevosAptosMes(mes) {
  return registrosProduccionMes(mes).reduce((s, r) => s + clasificadosRegistro(r), 0);
}
function maplesProducidosMes(mes) {
  // Solo huevos clasificados por tamaño: rotos y sucios no se consideran vendibles.
  return huevosAptosMes(mes) / 30;
}
function resumenCaja(mes) {
  /* Los ingresos salen solo de Pedidos: cada pedido entregado con su precio. */
  const ventas = [];
  const pedidosMes = (state.pedidos || []).filter(pd => pd.estado === 'ENTREGADO' && fechaIngresoPedido(pd).indexOf(mes) === 0);
  const pedidos = pedidosMes.filter(pd => Number(pd.precioTotal) > 0);
  const pedidosSinPrecio = pedidosMes.filter(pd => !(Number(pd.precioTotal) > 0));
  const ingresoVentas = 0;
  const ingresoPedidos = pedidos.reduce((s, pd) => s + (Number(pd.precioTotal) || 0), 0);
  const ingresoPedidosHuevos = pedidos.filter(pd => pd.producto === 'HUEVOS').reduce((s, pd) => s + (Number(pd.precioTotal) || 0), 0);
  const maplesVentas = 0;
  const maplesPedidos = pedidosMes.reduce((s, pd) => s + maplesDePedido(pd), 0);
  const maplesVendidos = maplesVentas + maplesPedidos;
  const producidos = maplesProducidosMes(mes);
  const huevosAptos = huevosAptosMes(mes);
  const regsProduccion = registrosProduccionMes(mes);
  const huevosRotos = regsProduccion.reduce((s, r) => s + (Number(r.rotos) || 0), 0);
  const huevosSucios = regsProduccion.reduce((s, r) => s + (Number(r.sucios) || 0), 0);
  // El costo de producir se divide por lo producido y apto para venta, no por lo vendido.
  const baseMaple = producidos;
  const gastosMes = (state.gastos || []).filter(g => {
    const gm = (g.fecha || '').slice(0, 7);
    if (!gm) return false;
    if (g.tipo === 'UNICO') return gm === mes;
    if (gm > mes) return false;
    if (g.hasta && mes > g.hasta) return false;
    return true;
  });
  let gastosFijosMes = 0, gastosVariableUnit = 0;
  gastosMes.forEach(g => {
    const monto = Number(g.monto) || 0;
    if (g.tipo === 'MAPLE') gastosVariableUnit += monto;
    else gastosFijosMes += monto;
  });
  /* Si el mes está en curso, contamos la parte de los gastos fijos de los días transcurridos */
  const partes = mes.split('-').map(Number);
  const diasMes = new Date(partes[0], partes[1], 0).getDate();
  const esMesEnCurso = mes === mesActualKey();
  const diasTranscurridos = esMesEnCurso ? new Date().getDate() : diasMes;
  const factorDias = esMesEnCurso ? Math.min(1, diasTranscurridos / diasMes) : 1;
  const gastosFijos = gastosFijosMes * factorDias;
  const gastosVariable = gastosVariableUnit * baseMaple;
  const gastosTotal = gastosFijos + gastosVariable;
  const gastosCargadosMes = gastosFijosMes + gastosVariable;
  const ingresos = ingresoVentas + ingresoPedidos;
  const ganancia = ingresos - gastosTotal;
  const costoMaple = (baseMaple > 0 && gastosTotal > 0) ? gastosTotal / baseMaple : null;
  const costoHuevo = (huevosAptos > 0 && gastosTotal > 0) ? gastosTotal / huevosAptos : null;
  const costoDocena = costoHuevo !== null ? costoHuevo * 12 : null;
  const costoMediaDocena = costoHuevo !== null ? costoHuevo * 6 : null;
  const gastoAlimento = gastosMes.filter(g => g.categoria === 'Alimento').reduce((s, g) => s + (Number(g.monto) || 0) * (g.tipo === 'MAPLE' ? baseMaple : 1), 0);
  const costoAlimentoHuevo = huevosAptos > 0 ? gastoAlimento / huevosAptos : null;
  const aves = totalGallinas();
  const diasProduccion = diasConDatos(regsProduccion);
  const postura = (aves > 0 && diasProduccion > 0) ? (huevosAptos / (aves * diasProduccion)) * 100 : null;
  const porcentajeDescarte = (huevosAptos + huevosRotos + huevosSucios) > 0 ? ((huevosRotos + huevosSucios) / (huevosAptos + huevosRotos + huevosSucios)) * 100 : null;
  const precioProm = maplesVendidos > 0 ? ingresoPedidosHuevos / maplesVendidos : null;
  const gananciaMaple = (costoMaple !== null && precioProm !== null) ? precioProm - costoMaple : null;
  const margen = ingresos > 0 ? (ganancia / ingresos) * 100 : null;
  const precioReferencia = precioProm !== null ? precioProm : (Number((state.precios || {}).uno) || 0);
  const costoVariableMaple = gastosVariableUnit;
  const margenContribucion = precioReferencia - costoVariableMaple;
  const puntoEquilibrio = margenContribucion > 0 ? Math.ceil(gastosFijos / margenContribucion) : null;
  const gananciaDocena = (precioProm !== null && costoDocena !== null) ? (precioProm / 30 * 12) - costoDocena : null;
  const gananciaMediaDocena = (precioProm !== null && costoMediaDocena !== null) ? (precioProm / 30 * 6) - costoMediaDocena : null;
  return { mes: mes, ventas: ventas, pedidos: pedidos, pedidosSinPrecio: pedidosSinPrecio, ingresoVentas: ingresoVentas, ingresoPedidos: ingresoPedidos, ingresoPedidosHuevos: ingresoPedidosHuevos,
    ingresos: ingresos, maplesVentas: maplesVentas, maplesPedidos: maplesPedidos, maplesVendidos: maplesVendidos,
    producidos: producidos, huevosAptos: huevosAptos, huevosRotos: huevosRotos, huevosSucios: huevosSucios, baseMaple: baseMaple, gastosMes: gastosMes, gastosFijos: gastosFijos,
    gastosFijosMes: gastosFijosMes, gastosVariableUnit: gastosVariableUnit, gastosVariable: gastosVariable,
    gastosTotal: gastosTotal, gastosCargadosMes: gastosCargadosMes, diasMes: diasMes,
    diasTranscurridos: diasTranscurridos, esMesEnCurso: esMesEnCurso, factorDias: factorDias,
    ganancia: ganancia, costoMaple: costoMaple, costoHuevo: costoHuevo, costoDocena: costoDocena, costoMediaDocena: costoMediaDocena,
    gastoAlimento: gastoAlimento, costoAlimentoHuevo: costoAlimentoHuevo, aves: aves, diasProduccion: diasProduccion, postura: postura,
    porcentajeDescarte: porcentajeDescarte, precioProm: precioProm, gananciaMaple: gananciaMaple, margen: margen,
    puntoEquilibrio: puntoEquilibrio, gananciaDocena: gananciaDocena, gananciaMediaDocena: gananciaMediaDocena };
}

function renderCaja() {
  const el = document.getElementById('view-caja');
  if (!el) return;
  const mes = state.cajaMes || mesActualKey();
  state.cajaMes = mes;
  const r = resumenCaja(mes);
  const p = state.precios || { uno: 9000, dos: 17000, tresMas: 8000 };
  const mesLabel = fmtMonthLabel(mes);
  const esMesActual = mes === mesActualKey();
  const hayDatos = r.ingresos > 0 || r.gastosTotal > 0;

  /* --- lista de gastos agrupada por categoría --- */
  const cats = [];
  r.gastosMes.forEach(g => {
    const c = g.categoria || 'Otros';
    if (cats.indexOf(c) === -1) cats.push(c);
  });
  cats.sort((a, b) => {
    const ia = CATEGORIAS_GASTO.indexOf(a); const ib = CATEGORIAS_GASTO.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
  let gastosHtml = '';
  cats.forEach(c => {
    const items = r.gastosMes.filter(g => (g.categoria || 'Otros') === c);
    const subtotal = items.reduce((s, g) => s + (g.tipo === 'MAPLE' ? (Number(g.monto) || 0) * r.baseMaple : (Number(g.monto) || 0)), 0);
    gastosHtml += '<div class="cajaCatHead"><span>' + escapeHtml(c) + '</span><b>' + money(subtotal) + '</b></div>';
    gastosHtml += items.map(g => {
      const gm = (g.fecha || '').slice(0, 7);
      const monto = g.tipo === 'MAPLE' ? (Number(g.monto) || 0) * r.baseMaple : (Number(g.monto) || 0);
      let sub = '';
      if (g.tipo === 'MAPLE') sub = money(g.monto) + ' por maple × ' + (Math.round(r.baseMaple * 10) / 10) + ' maples';
      else if (g.tipo === 'UNICO') sub = 'Solo ' + fmtMonthLabel(gm);
      else sub = g.ajustado ? 'Valor nuevo desde ' + fmtMonthLabel(gm) : '';
      const tag = g.tipo === 'MAPLE' ? '<span class="gastoTag gastoTag--maple">Por maple</span>' : g.tipo === 'UNICO' ? '<span class="gastoTag gastoTag--unico">Solo este mes</span>' : '<span class="gastoTag">Mensual</span>';
      return '<div class="cajaRow">' +
        '<div class="cajaRow__main"><strong>' + escapeHtml(g.descripcion || '-') + '</strong>' + tag +
          '<div class="cajaRow__sub">' + sub + '</div></div>' +
        '<div class="cajaRow__monto">' + money(monto) + '</div>' +
        '<div class="cajaRow__actions">' +
          '<button class="iconBtn iconBtn--edit" data-editg="' + g.id + '" aria-label="Editar gasto">' + ICONS.pencil + '</button>' +
          '<button class="iconBtn iconBtn--danger" data-delg="' + g.id + '" aria-label="Eliminar gasto">' + ICONS.trash + '</button>' +
        '</div></div>';
    }).join('');
  });

  /* --- simulación de venta diaria --- */
  const maplesDia = Math.max(1, Math.floor(Number(state.maplesConfig.maples) || 7));
  const simIngreso = precioSugerido(maplesDia) * 30;
  const simGastos = r.gastosFijosMes + r.gastosVariableUnit * maplesDia * 30;
  const simGanancia = simIngreso - simGastos;
  const simHayGastos = (r.gastosFijosMes + r.gastosVariableUnit) > 0;

  el.innerHTML =
    '<section class="panel">' +
      '<div class="panel__head"><h3>Mes de la caja</h3></div>' +
      '<div style="display:flex;gap:8px;align-items:flex-end">' +
        '<label class="field" style="flex:1;margin:0"><span>Mes</span><input type="month" id="cj_mes" value="' + mes + '"></label>' +
        '<button class="btn btn--ghost" id="cjPrev" style="flex:none;width:46px" aria-label="Mes anterior">‹</button>' +
        '<button class="btn btn--ghost" id="cjNext" style="flex:none;width:46px" aria-label="Mes siguiente"' + (esMesActual ? ' disabled' : '') + '>›</button>' +
      '</div>' +
    '</section>' +

    '<section class="cajaHero">' +
      '<div class="cajaHero__label">Resultado del período · ' + mesLabel + '</div>' +
      '<div class="cajaHero__big ' + (r.ganancia >= 0 ? 'pos' : 'neg') + '">' + (hayDatos ? money(r.ganancia) : '$ 0') + '</div>' +
      '<div class="cajaHero__sub">' + (hayDatos ? 'Resultado operativo · Margen: ' + (r.margen !== null ? pct(r.margen) : '—') : 'Cargá producción, pedidos y gastos para calcular el resultado') + '</div>' +
      '<div class="cajaHero__row">' +
        '<div class="cajaHero__item"><span>Ingresos</span><strong>' + money(r.ingresos) + '</strong></div>' +
        '<div class="cajaHero__item"><span>Gastos</span><strong>' + money(r.gastosTotal) + '</strong></div>' +
        '<div class="cajaHero__item"><span>Maples aptos producidos</span><strong>' + num(Math.round(r.producidos * 10) / 10) + '</strong></div>' +
      '</div>' +
    '</section>' +

    '<section class="panel">' +
      '<div class="panel__head"><h3>Costo real de producción</h3></div>' +
      '<p class="cajaNota" style="margin:0 0 10px">Se calcula sobre los huevos clasificados por tamaño. Los rotos y sucios quedan fuera de la cantidad vendible.</p>' +
      '<div class="cajaGrid">' +
        '<div class="cajaMini"><span>Costo por huevo</span><strong>' + (r.costoHuevo !== null ? money(r.costoHuevo) : '—') + '</strong></div>' +
        '<div class="cajaMini"><span>Costo por maple (30)</span><strong>' + (r.costoMaple !== null ? money(r.costoMaple) : '—') + '</strong></div>' +
        '<div class="cajaMini"><span>Costo por docena</span><strong>' + (r.costoDocena !== null ? money(r.costoDocena) : '—') + '</strong></div>' +
        '<div class="cajaMini"><span>Costo por media docena</span><strong>' + (r.costoMediaDocena !== null ? money(r.costoMediaDocena) : '—') + '</strong></div>' +
      '</div>' +
      '<p class="cajaNota">Incluye alimento, sanidad, operativos y envases registrados. Cargá todos los gastos para que el costo sea representativo.</p>' +
    '</section>' +

    '<section class="panel">' +
      '<div class="panel__head"><h3>Indicadores de la granja</h3></div>' +
      '<div class="cajaGrid">' +
        '<div class="cajaMini"><span>Huevos aptos</span><strong>' + num(r.huevosAptos) + '</strong></div>' +
        '<div class="cajaMini"><span>Postura promedio</span><strong>' + (r.postura !== null ? pct(r.postura) : '—') + '</strong></div>' +
        '<div class="cajaMini"><span>Alimento por huevo*</span><strong>' + (r.costoAlimentoHuevo !== null ? money(r.costoAlimentoHuevo) : '—') + '</strong></div>' +
        '<div class="cajaMini"><span>Descarte (rotos + sucios)</span><strong>' + (r.porcentajeDescarte !== null ? pct(r.porcentajeDescarte) : '—') + '</strong></div>' +
        '<div class="cajaMini"><span>Huevos rotos</span><strong>' + num(r.huevosRotos) + '</strong></div>' +
        '<div class="cajaMini"><span>Huevos sucios</span><strong>' + num(r.huevosSucios) + '</strong></div>' +
      '</div>' +
      '<p class="cajaNota">*Costo del alimento registrado dividido por huevos aptos. La postura usa las aves cargadas en los galpones y los días con registro de producción.</p>' +
    '</section>' +

    '<section class="panel">' +
      '<div class="panel__head"><h3>Rentabilidad por presentación</h3></div>' +
      '<div class="cajaGrid">' +
        '<div class="cajaMini"><span>Precio promedio por maple de huevos</span><strong>' + (r.precioProm !== null ? money(r.precioProm) : '—') + '</strong></div>' +
        '<div class="cajaMini"><span>Ganancia estimada por maple</span><strong>' + (r.gananciaMaple !== null ? money(r.gananciaMaple) : '—') + '</strong></div>' +
        '<div class="cajaMini"><span>Ganancia estimada por docena</span><strong>' + (r.gananciaDocena !== null ? money(r.gananciaDocena) : '—') + '</strong></div>' +
        '<div class="cajaMini"><span>Ganancia estimada por media docena</span><strong>' + (r.gananciaMediaDocena !== null ? money(r.gananciaMediaDocena) : '—') + '</strong></div>' +
        '<div class="cajaMini"><span>Punto de equilibrio</span><strong>' + (r.puntoEquilibrio !== null ? num(r.puntoEquilibrio) + ' maples' : '—') + '</strong></div>' +
        '<div class="cajaMini"><span>Maples vendidos</span><strong>' + num(Math.round(r.maplesVendidos * 10) / 10) + '</strong></div>' +
      '</div>' +
      '<p class="cajaNota">Las ganancias por presentación son estimaciones prorrateadas desde el precio promedio por maple vendido. El precio promedio por maple considera solo pedidos de huevos. El punto de equilibrio es una estimación y no incluye otros productos con estructura de costos propia.</p>' +
    '</section>' +

    '<section class="panel">' +
      '<div class="panel__head"><h3>Ventas del mes</h3><span class="chip chip--on" style="flex:none">' + money(r.ingresoPedidos) + '</span></div>' +
      '<p class="cajaNota" style="margin:0 0 6px">' + (r.pedidos.length
        ? 'Suma de <b>' + r.pedidos.length + (r.pedidos.length === 1 ? ' pedido entregado' : ' pedidos entregados') + '</b> en ' + mesLabel + '. Sale solo de la pestaña Pedidos, no hay nada que cargar acá.'
        : 'Todavía no hay pedidos entregados con precio en ' + mesLabel + '. Sale solo de la pestaña Pedidos.') + '</p>' +
      (r.pedidosSinPrecio.length ? '<p class="cajaNota" style="color:#a0522d">' + r.pedidosSinPrecio.length + (r.pedidosSinPrecio.length === 1 ? ' pedido entregado no tiene precio cargado' : ' pedidos entregados no tienen precio cargado') + ' y no suma en la caja. Abrí ese pedido en Pedidos y poné el total.</p>' : '') +
      '<button class="btn btn--ghost" id="btnIrPedidos" style="margin:6px 0 2px">Ir a Pedidos ›</button>' +
    '</section>' +

    '<section class="panel">' +
      '<div class="panel__head"><h3>Gastos del mes</h3><span class="chip chip--on" style="flex:none">' + money(r.gastosCargadosMes) + '</span></div>' +
      '<p class="cajaNota" style="margin:0 0 10px">Los que dicen <b>Mensual</b> se repiten solos todos los meses. Si cambiás el monto, el valor nuevo vale <b>desde el mes que elijas</b>: los meses anteriores quedan como estaban.</p>' +
      '<div class="cajaGrid" style="margin-bottom:6px">' +
        '<div class="cajaMini"><span>Gastos sin envases</span><strong>' + money(r.gastosFijosMes) + '</strong></div>' +
        '<div class="cajaMini"><span>Envases de la producción</span><strong>' + money(r.gastosVariable) + '</strong></div>' +
      '</div>' +
      (r.factorDias < 1 && r.gastosFijosMes > 0 ? '<p class="cajaNota">Los montos de la lista son por mes completo. En las cuentas de arriba contamos ' + r.diasTranscurridos + ' de ' + r.diasMes + ' días (' + money(r.gastosFijos) + ').</p>' : '') +
      (gastosHtml || emptyState('Todavía no cargaste gastos. Podés empezar con los de tu planilla.', null)) +
      '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">' +
        '<button class="btn btn--primary" id="btnNuevoGasto" style="flex:1">+ Nuevo gasto</button>' +
        '<button class="btn btn--ghost" id="btnGastosPlanilla" style="flex:1">Cargar planilla</button>' +
      '</div>' +
      '<p class="cajaNota">La planilla trae 17 gastos ya clasificados: 4 de alimento, 4 de sanidad, 4 operativos y 5 de envases por maple.</p>' +
    '</section>' +

    '<section class="panel">' +
      '<div class="panel__head"><h3>Precios de venta</h3></div>' +
      '<p class="cajaNota" style="margin:0 0 10px">Tus precios de combo. Se usan en la simulación de abajo para estimar la ganancia.</p>' +
      '<div class="formRow2">' +
        '<label class="field"><span>1 maple</span><input type="number" min="0" step="100" id="pr_uno" value="' + (Number(p.uno) || 0) + '"></label>' +
        '<label class="field"><span>2 maples (total)</span><input type="number" min="0" step="100" id="pr_dos" value="' + (Number(p.dos) || 0) + '"></label>' +
      '</div>' +
      '<label class="field"><span>3 o más (por maple)</span><input type="number" min="0" step="100" id="pr_tres" value="' + (Number(p.tresMas) || 0) + '"></label>' +
      '<button class="btn btn--secondary" id="btnGuardarPrecios">Guardar precios</button>' +
      '<p class="cajaNota">Ejemplo: 7 maples = ' + money(precioSugerido(7)) + ' (' + money((Number(p.tresMas) || 0)) + ' c/u).</p>' +
    '</section>' +

    '<section class="panel">' +
      '<div class="panel__head"><h3>Si vendés todos los días</h3></div>' +
      '<label class="field"><span>Maples por día</span><input type="number" min="1" step="1" id="sim_maples" value="' + maplesDia + '"></label>' +
      '<div class="cajaGrid">' +
        '<div class="cajaMini"><span>Ingreso estimado / mes</span><strong id="sim_ing">' + money(simIngreso) + '</strong></div>' +
        '<div class="cajaMini"><span>Gastos estimados / mes</span><strong id="sim_gas">' + (simHayGastos ? money(simGastos) : '—') + '</strong></div>' +
        '<div class="cajaMini"><span>Ganancia estimada / mes</span><strong id="sim_gan">' + (simHayGastos ? money(simGanancia) : '—') + '</strong></div>' +
        '<div class="cajaMini"><span>Ganancia por maple</span><strong id="sim_gpm">' + (simHayGastos ? money(simGanancia / (maplesDia * 30)) : '—') + '</strong></div>' +
      '</div>' +
      '<p class="cajaNota">' + (simHayGastos ? 'Estimado a 30 días, con los gastos cargados en ' + mesLabel + '. Si cargás más gastos, el número se ajusta solo.' : 'Cargá primero tus gastos para ver la ganancia estimada.') + '</p>' +
    '</section>' +

    '<section class="panel">' +
      '<div class="panel__head"><h3>Últimos 6 meses</h3></div>' +
      (hayDatos || resumenCaja(shiftMes(mes, -1)).ingresos > 0 || resumenCaja(shiftMes(mes, -1)).gastosTotal > 0
        ? '<canvas id="chartCaja" height="220"></canvas>'
        : emptyState('Cuando cargues ventas y gastos vas a ver acá la comparación mes a mes.', null)) +
    '</section>';

  /* --- eventos --- */
  document.getElementById('cj_mes').addEventListener('change', (e) => {
    if (e.target.value) { state.cajaMes = e.target.value; renderCaja(); }
  });
  document.getElementById('cjPrev').addEventListener('click', () => { state.cajaMes = shiftMes(mes, -1); renderCaja(); });
  const btnNext = document.getElementById('cjNext');
  if (btnNext) btnNext.addEventListener('click', () => { state.cajaMes = shiftMes(mes, 1); renderCaja(); });

  const btnIrPedidos = document.getElementById('btnIrPedidos');
  if (btnIrPedidos) btnIrPedidos.addEventListener('click', () => setTab('pedidos'));
  document.getElementById('btnNuevoGasto').addEventListener('click', () => abrirGastoModal(null));
  document.getElementById('btnGastosPlanilla').addEventListener('click', cargarGastosPlanilla);
  el.querySelectorAll('[data-editg]').forEach(btn => btn.addEventListener('click', () => abrirGastoModal(btn.getAttribute('data-editg'))));
  el.querySelectorAll('[data-delg]').forEach(btn => btn.addEventListener('click', async () => {
    const id = btn.getAttribute('data-delg');
    if (!confirm('\u00bfBorrar este gasto?')) return;
    try { await eliminarGastoPorId(id); toast('Gasto eliminado'); renderCaja(); }
    catch (err) { toast('No se pudo borrar: ' + err.message); }
  }));

  const simInp = document.getElementById('sim_maples');
  simInp.addEventListener('input', () => {
    if (!simHayGastos) return;
    const n = Math.max(1, Math.floor(Number(simInp.value) || 0));
    const ing = precioSugerido(n) * 30;
    const gas = r.gastosFijosMes + r.gastosVariableUnit * n * 30;
    document.getElementById('sim_ing').textContent = money(ing);
    document.getElementById('sim_gas').textContent = money(gas);
    document.getElementById('sim_gan').textContent = money(ing - gas);
    document.getElementById('sim_gpm').textContent = money((ing - gas) / (n * 30));
  });

  document.getElementById('btnGuardarPrecios').addEventListener('click', async () => {
    state.precios = {
      uno: Number(document.getElementById('pr_uno').value) || 0,
      dos: Number(document.getElementById('pr_dos').value) || 0,
      tresMas: Number(document.getElementById('pr_tres').value) || 0
    };
    await guardarPreciosLocal();
    toast('Precios guardados \u2713');
    renderCaja();
  });

  if (document.getElementById('chartCaja')) drawCajaChart(mes);
}

function abrirGastoModal(id) {
  const g = id ? (state.gastos || []).find(x => x.id === id) : null;
  const mes = state.cajaMes || mesActualKey();
  const tipoIni = g ? (g.tipo || 'MENSUAL') : 'MENSUAL';
  const mesIni = g ? (g.fecha || mes + '-01').slice(0, 7) : mes;
  const fechaIni = g ? (g.fecha || mes + '-01') : (mes === mesActualKey() ? todayStr() : mes + '-01');
  const esUnico = tipoIni === 'UNICO';
  const modal = document.getElementById('modalEditar');
  modal.innerHTML =
    '<div class="modalCard">' +
      '<div class="modalCard__head"><h3>' + (g ? 'Editar gasto' : 'Nuevo gasto') + '</h3><button class="iconBtn" id="cerrarGasto">' + ICONS.x + '</button></div>' +
      '<form id="formGasto" class="form">' +
        '<label class="field"><span>¿Cómo se repite?</span><select id="gt_tipo">' +
          '<option value="MENSUAL"' + (tipoIni === 'MENSUAL' ? ' selected' : '') + '>Todos los meses (fijo)</option>' +
          '<option value="UNICO"' + (tipoIni === 'UNICO' ? ' selected' : '') + '>Solo este mes</option>' +
          '<option value="MAPLE"' + (tipoIni === 'MAPLE' ? ' selected' : '') + '>Por cada maple vendido</option>' +
        '</select></label>' +
        '<label class="field"><span>Categoría</span><select id="gt_cat">' +
          CATEGORIAS_GASTO.map(c => '<option value="' + c + '"' + (g && g.categoria === c ? ' selected' : '') + '>' + c + '</option>').join('') +
        '</select></label>' +
        '<label class="field"><span>Descripción</span><input type="text" id="gt_desc" placeholder="Ej: Alimento balanceado" value="' + escapeHtml(g ? (g.descripcion || '') : '') + '" required></label>' +
        '<label class="field"><span>Monto ($)</span><input type="number" min="0" step="1" id="gt_monto" value="' + (g ? (Number(g.monto) || 0) : '') + '" required></label>' +
        '<label class="field" id="fldMes"' + (esUnico ? ' style="display:none"' : '') + '><span>Vale desde el mes</span><input type="month" id="gt_mes" value="' + mesIni + '"></label>' +
        '<label class="field" id="fldFecha"' + (esUnico ? '' : ' style="display:none"') + '><span>Fecha del gasto</span><input type="date" id="gt_fecha" value="' + fechaIni + '"></label>' +
        '<p class="cajaNota" id="gt_hint"></p>' +
        '<button type="submit" class="btn btn--primary">' + (g ? 'Guardar cambios' : 'Agregar gasto') + '</button>' +
      '</form>' +
    '</div>';
  modal.classList.add('modal--open');
  document.getElementById('cerrarGasto').addEventListener('click', () => modal.classList.remove('modal--open'));

  const hint = document.getElementById('gt_hint');
  const tipoSel = document.getElementById('gt_tipo');
  const actualizarHint = () => {
    const t = tipoSel.value;
    document.getElementById('fldMes').style.display = t === 'UNICO' ? 'none' : '';
    document.getElementById('fldFecha').style.display = t === 'UNICO' ? '' : 'none';
    hint.textContent = t === 'MAPLE'
      ? 'Por cada maple vendido. Se cuenta todos los meses desde el mes que elijas: si cambiás el precio de los envases, el nuevo vale desde ahí y los meses anteriores no se tocan.'
      : t === 'UNICO'
        ? 'Se cuenta solo en el mes de esa fecha (por ejemplo, una reparación).'
        : 'Se repite todos los meses. Si cambiás el monto, el valor nuevo vale desde el mes que elijas y los meses anteriores quedan como estaban.';
  };
  tipoSel.addEventListener('change', actualizarHint);
  actualizarHint();

  document.getElementById('formGasto').addEventListener('submit', async (e) => {
    e.preventDefault();
    const descripcion = document.getElementById('gt_desc').value.trim();
    const monto = Number(document.getElementById('gt_monto').value) || 0;
    const tipo = tipoSel.value;
    const categoria = document.getElementById('gt_cat').value;
    if (!descripcion) { toast('Poné una descripción.'); return; }
    if (monto <= 0) { toast('Poné un monto mayor a cero.'); return; }
    let fecha;
    if (tipo === 'UNICO') {
      fecha = document.getElementById('gt_fecha').value || mes + '-01';
    } else {
      const m = document.getElementById('gt_mes').value || mes;
      fecha = m + '-01';
    }
    const nuevoMes = fecha.slice(0, 7);
    const datos = { categoria: categoria, descripcion: descripcion, monto: monto, tipo: tipo, fecha: fecha };

    try {
      if (g && g.tipo !== 'UNICO' && nuevoMes > (g.fecha || '').slice(0, 7)) {
        const cambio = monto !== (Number(g.monto) || 0) || descripcion !== (g.descripcion || '') || categoria !== (g.categoria || '');
        if (cambio) {
          await actualizarGasto(g.id, { hasta: shiftMes(nuevoMes, -1) });
          await crearGasto({
            id: 'gt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            categoria: categoria, descripcion: descripcion, monto: monto, tipo: tipo, fecha: fecha,
            ajustado: true, creadoEn: new Date().toISOString(), usuario: state.perfil.nombre || ''
          });
          modal.classList.remove('modal--open');
          toast('Listo: el valor nuevo vale desde ' + fmtMonthLabel(nuevoMes) + '. Los meses anteriores quedan igual.');
          renderCaja();
          return;
        }
      }
      if (g) {
        datos.ajustado = true;
        await actualizarGasto(g.id, datos);
        toast('Gasto actualizado \u2713');
      } else {
        datos.id = 'gt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        datos.creadoEn = new Date().toISOString();
        datos.usuario = state.perfil.nombre || '';
        await crearGasto(datos);
        toast('Gasto agregado \u2713');
      }
      modal.classList.remove('modal--open');
      renderCaja();
    } catch (err) { toast('No se pudo guardar: ' + err.message); }
  });
}

const PLANILLA_VIEJOS = [
  'Alimento + conchilla + suplemento',
  'Sanidad: veterinaria, vinagre, probióticos, antiparasitario',
  'Viruta, luz, mantenimiento y nafta',
  'Maples, film, etiquetas, sellos y bolsitas'

async function cargarGastosPlanilla() {
  const mes = state.cajaMes || mesActualKey();

  /* Si venían los 4 gastos resumidos de la carga anterior, se cambian por el detalle */
  const viejos = (state.gastos || []).filter(g => PLANILLA_VIEJOS.indexOf(g.descripcion || '') !== -1);
  if (viejos.length) {
    if (!confirm('Encontr\u00e9 ' + viejos.length + ' gastos resumidos de la carga anterior de la planilla.\n\nLos reemplazo por el detalle completo as\u00ed no se cuenta dos veces. \u00bfSeguimos?')) return;
    for (const g of viejos) { try { await eliminarGastoPorId(g.id); } catch (e) {} }
  }

  const existentes = state.gastos || [];
  const faltan = [];
  let actualizados = 0;

  // MENSUAL y MAPLE son gastos recurrentes desde su fecha de inicio.
  // Si ya existen con una fecha posterior al mes elegido, adelantamos su
  // inicio para que también cubran ese período, sin crear duplicados.
  for (const s of PLANILLA_GASTOS) {
    const coincidencias = existentes.filter(g =>
      g.categoria === s.categoria && (g.descripcion || '') === s.descripcion
    );
    if (s.tipo === 'UNICO') {
      const existeEnMes = coincidencias.some(g => (g.fecha || '').slice(0, 7) === mes);
      if (!existeEnMes) faltan.push(s);
      continue;
    }

    const recurrenteActivo = coincidencias.find(g => {
      const gm = (g.fecha || '').slice(0, 7);
      return g.tipo !== 'UNICO' && gm && gm <= mes;
    });
    if (recurrenteActivo) continue;

    const recurrenteFuturo = coincidencias
      .filter(g => (g.tipo !== 'UNICO') && (g.fecha || '').slice(0, 7) > mes)
      .sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''))[0];
    if (recurrenteFuturo) {
      await actualizarGasto(recurrenteFuturo.id, { fecha: mes + '-01' });
      actualizados++;
    } else {
      faltan.push(s);
    }
  }

  if (!faltan.length) {
    toast(actualizados
      ? 'Planilla actualizada para ' + fmtMonthLabel(mes) + ' \u2713'
      : 'Los gastos de la planilla ya están cargados para este mes \\u2713');
    renderCaja();
    return;
  }

  const porCat = {};
  faltan.forEach(s => {
    if (!porCat[s.categoria]) porCat[s.categoria] = { n: 0, total: 0, maple: false };
    porCat[s.categoria].n++;
    porCat[s.categoria].total += s.monto;
    if (s.tipo === 'MAPLE') porCat[s.categoria].maple = true;
  });
  const detalle = Object.keys(porCat).map(c => {
    const d = porCat[c];
    return '\u2022 ' + c + ': ' + d.n + (d.n === 1 ? ' gasto' : ' gastos') + ' \u2014 ' + money(d.total) + (d.maple ? ' por maple' : ' por mes');
  }).join('\n');
  const msg = 'Se van a cargar ' + faltan.length + ' gastos de tu planilla:\n\n' + detalle +
    '\n\nDespu\u00e9s pod\u00e9s editar cualquiera, borrarlo o agregar nuevos. \u00bfSeguimos?';
  if (!confirm(msg)) return;

  try {
    for (const s of faltan) {
      await crearGasto({
        id: 'gt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        categoria: s.categoria, descripcion: s.descripcion, monto: s.monto, tipo: s.tipo,
        fecha: mes + '-01', sugerido: true, creadoEn: new Date().toISOString(), usuario: state.perfil.nombre || ''
      });
    }
    toast(faltan.length + ' gastos cargados' + (actualizados ? ' y ' + actualizados + ' actualizados' : '') + ' \u2713');
    renderCaja();
  } catch (err) { toast('No se pudieron cargar: ' + err.message); }
}

          (function() { const aves = gallinasRecuentoReciente(); const dias = diasConDatos(lista); const pp = (aves > 0 && dias > 0) ? ((agg.total / dias) / aves) * 100 : null; return pp !== null ? '<tr><td>Pico de postura promedio</td><td><strong>' + pctPostura(pp) + '</strong> huevos/gallinas</td></tr>' : ''; })() +
          '</tbody></table></div>'

    '</section>' +

      (lista.length ? '<div id="listaReportes"></div>' : emptyState('Sin datos en este período.', null)) +

  };
  document.getElementById('rep_desde').addEventListener('change', onRangeChange);
  document.getElementById('rep_hasta').addEventListener('change', onRangeChange);

  const btnPdf = document.getElementById('btnPdf');
  const btnExcel = document.getElementById('btnExcel');

  if (btnExcel) btnExcel.addEventListener('click', () => exportarExcel(state.reportRange.desde, state.reportRange.hasta));

function chartImageOffscreen(type, config, w, h) {

/* ---------- Exportar PDF ---------- */
async function exportarPDF(desde, hasta) {
  try {
  const lista = filtrarRango(desde, hasta);
  const agg = agregados(lista);
  const rotosPct = agg.total ? (agg.rotos / agg.total) * 100 : 0;
  if (!window.jspdf || !window.jspdf.jsPDF) { toast('Error: librería PDF no disponible. Verificá la conexión a internet.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const marginX = 42;

  /* Header oscuro con brillo cálido */
  doc.setFillColor(42, 31, 22);
  doc.rect(0, 0, pageW, 86, 'F');
  doc.setTextColor(200, 149, 106);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(20);
  doc.text('Granja Ercilia', marginX, 40);
  doc.setTextColor(226, 232, 240);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
  doc.text('Reporte de producci\u00f3n de huevos', marginX, 60);
  doc.text('Per\u00edodo: ' + fmtDateLong(desde) + '  al  ' + fmtDateLong(hasta), marginX, 76);

  let y = 116;
  doc.setTextColor(226, 232, 240);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
  doc.text('Resumen', marginX, y);
  y += 10;

  const resumenBody = [
    ['Total recolectado', num(agg.total)],
    ['Peque\u00f1os', num(agg.pequenos)],
    ['Medianos', num(agg.medianos)],
    ['Grandes', num(agg.grandes)],
    ['Extra grandes', num(agg.extraGrandes)],
    ['Rotos', num(agg.rotos) + ' (' + pct(rotosPct) + ')'],
    ['Sucios / descartados', num(agg.sucios)],
    ['D\u00edas con registro', String(diasConDatos(lista))]
  ];
  const avesPdf = gallinasRecuentoReciente(); const diasPdf = diasConDatos(lista);
  const ppPdf = (avesPdf > 0 && diasPdf > 0) ? ((agg.total / diasPdf) / avesPdf) * 100 : null;
  if (ppPdf !== null) resumenBody.push(['Pico de postura promedio', pctPostura(ppPdf) + ' huevos/gallinas']);
  doc.autoTable({
    startY: y, margin: { left: marginX, right: marginX },
    head: [['Indicador', 'Valor']], body: resumenBody,
    theme: 'plain', styles: { font: 'helvetica', fontSize: 10, textColor: [226, 232, 240], cellPadding: 5 },
    headStyles: { fillColor: [42, 31, 22], textColor: [200, 149, 106], fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [33, 24, 18] },
    bodyStyles: { fillColor: [28, 21, 16] }
  });

  y = doc.lastAutoTable.finalY + 24;
  if (agg.total) {
    let barImg = null, pieImg = null;
    try {
      barImg = chartImageOffscreen('bar', {
        data: { labels: SIZE_KEYS.map(k => SIZE_LABELS[k]), datasets: [{ data: SIZE_KEYS.map(k => agg[k]), backgroundColor: SIZE_KEYS.map(k => SIZE_COLORS[k]), borderColor: SIZE_KEYS.map(k => SIZE_COLORS[k]), borderWidth: 1 }] },
        options: { responsive: false, animation: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#94A3B8' }, grid: { display: false } }, y: { ticks: { color: '#94A3B8' }, grid: { color: 'rgba(255,255,255,0.06)' }, beginAtZero: true } } }
      }, 560, 320);
      pieImg = chartImageOffscreen('doughnut', {
        data: { labels: SIZE_KEYS.map(k => SIZE_LABELS[k]), datasets: [{ data: SIZE_KEYS.map(k => agg[k]), backgroundColor: SIZE_KEYS.map(k => SIZE_COLORS[k]), borderColor: SIZE_KEYS.map(k => SIZE_COLORS[k]), borderWidth: 2 }] },
        options: { responsive: false, animation: false, plugins: { legend: { position: 'bottom', labels: { color: '#94A3B8' } } } }
      }, 560, 380);
    } catch(e) { console.warn('Error generando gr\u00e1ficos PDF:', e); }

    if (y > 620) { doc.addPage(); y = 40; }
    doc.setTextColor(226, 232, 240);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
    doc.text('Clasificaci\u00f3n por tama\u00f1o', marginX, y);
    y += 10;
    if (barImg && pieImg) {
      const imgW = (pageW - marginX * 2 - 16) / 2;
      doc.addImage(barImg, 'PNG', marginX, y, imgW, imgW * (320 / 560));
      doc.addImage(pieImg, 'PNG', marginX + imgW + 16, y, imgW, imgW * (380 / 560));
      y += imgW * (320 / 560) + 26;
    }
  }

  const porDia = {};
  lista.forEach(r => {
    porDia[r.fecha] = porDia[r.fecha] || { total: 0, rotos: 0, sucios: 0 };
    porDia[r.fecha].total += totalRegistro(r);
    porDia[r.fecha].rotos += Number(r.rotos) || 0;
    porDia[r.fecha].sucios += Number(r.sucios) || 0;
  });
  const diasOrdenados = Object.keys(porDia).sort();
  if (diasOrdenados.length) {
    if (y > 680) { doc.addPage(); y = 40; }
    doc.setTextColor(226, 232, 240);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
    doc.text('Detalle por d\u00eda', marginX, y);
    y += 8;
    doc.autoTable({
      startY: y, margin: { left: marginX, right: marginX },
      head: [['Fecha', 'Total', 'Rotos', 'Sucios']],
      body: diasOrdenados.map(d => [fmtDateShort(d), num(porDia[d].total), num(porDia[d].rotos), num(porDia[d].sucios)]),
      theme: 'striped', styles: { font: 'helvetica', fontSize: 9.5, cellPadding: 5, textColor: [226, 232, 240] },
      headStyles: { fillColor: [94, 125, 83], textColor: [255, 255, 255] },
      alternateRowStyles: { fillColor: [33, 24, 18] },
      bodyStyles: { fillColor: [28, 21, 16] }
    });
  }

  const totalPages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= totalPages; i++) {
    doc.setPage(i);
    doc.setFontSize(8.5); doc.setTextColor(148, 163, 184);
    doc.text('Generado el ' + fmtDateLong(todayStr()) + ' \u00b7 Granja Ercilia', marginX, doc.internal.pageSize.getHeight() - 20);
  }

  doc.save('granja-ercilia-reporte_' + desde + '_a_' + hasta + '.pdf');
  toast('PDF generado \u2713');
  } catch(e) { console.error('Error exportarPDF:', e); toast('Error al generar PDF: ' + e.message); }
}

/* ---------- Exportar Excel ---------- */
function exportarExcel(desde, hasta) {
  const lista = filtrarRango(desde, hasta).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  const agg = agregados(lista);
  const rotosPct = agg.total ? (agg.rotos / agg.total) * 100 : 0;

  const filasRegistros = lista.map(r => {
    const g = state.galpones.find(g => g.id === r.galponId);
    return {
      Fecha: r.fecha, Hora: r.hora, Galpón: g ? g.nombre : '', Pequeños: r.pequenos, Medianos: r.medianos,
      Grandes: r.grandes, 'Extra grandes': r.extraGrandes, Rotos: r.rotos, 'Sucios/Descartados': r.sucios,
      Total: totalRegistro(r), Usuario: r.usuario, Observaciones: r.observaciones
    };
  });
  const resumen = [
    { Indicador: 'Período', Valor: desde + ' a ' + hasta },
    { Indicador: 'Total recolectado', Valor: agg.total },
    { Indicador: 'Pequeños', Valor: agg.pequenos },
    { Indicador: 'Medianos', Valor: agg.medianos },
    { Indicador: 'Grandes', Valor: agg.grandes },
    { Indicador: 'Extra grandes', Valor: agg.extraGrandes },
    { Indicador: 'Rotos', Valor: agg.rotos },
    { Indicador: '% Rotos', Valor: Number(rotosPct.toFixed(2)) },
    { Indicador: 'Sucios/Descartados', Valor: agg.sucios },
    { Indicador: 'Días con registro', Valor: diasConDatos(lista) }
  ];
  const avesExcel = gallinasRecuentoReciente(); const diasExcel = diasConDatos(lista);
  const ppExcel = (avesExcel > 0 && diasExcel > 0) ? ((agg.total / diasExcel) / avesExcel) * 100 : null;
  if (ppExcel !== null) resumen.push({ Indicador: 'Pico de postura promedio (%)', Valor: Number(Math.min(100, ppExcel).toFixed(2)) });

  const wb = XLSX.utils.book_new();
  const wsResumen = XLSX.utils.json_to_sheet(resumen);
  const wsRegistros = XLSX.utils.json_to_sheet(filasRegistros);
  XLSX.utils.book_append_sheet(wb, wsResumen, 'Resumen');
  XLSX.utils.book_append_sheet(wb, wsRegistros, 'Registros');
  XLSX.writeFile(wb, 'granja-ercilia-reporte_' + desde + '_a_' + hasta + '.xlsx');
  toast('Excel generado ✓');
}

/* ---------- Perfil (rol) / respaldo ---------- */
let mostrarFormNube = false;
function renderPerfilModal() {
  const modal = document.getElementById('modalPerfil');
  const conectado = !!db;
  modal.innerHTML =
    '<div class="modalCard">' +
      '<div class="modalCard__head"><h3>Perfil y ajustes</h3><button class="iconBtn" id="cerrarPerfil">' + ICONS.x + '</button></div>' +
      '<label class="field"><span>Nombre (opcional)</span><input type="text" id="p_nombre" value="' + escapeHtml(state.perfil.nombre) + '" placeholder="Tu nombre"></label>' +
      '<label class="field"><span>Rol</span><select id="p_rol">' +
        ['Administrador', 'Supervisor', 'Operario'].map(r => '<option value="' + r + '"' + (state.perfil.rol === r ? ' selected' : '') + '>' + r + '</option>').join('') +
      '</select></label>' +
      '<p class="modalNote">El rol define qué secciones podés usar. Administrador: todo. Supervisor: ver e informar. Operario: registrar producción.</p>' +
      '<button class="btn btn--primary" id="guardarPerfil">Guardar</button>' +
      '<div class="divider"></div>' +
      '<h4 class="modalSubhead">Sincronización en tiempo real</h4>' +
      (conectado ?
        '<div class="alertCard alertCard--ok2">' + ICONS.check + '<span>Conectado a la nube. Todo el equipo ve los mismos datos al instante, desde su propio celular.</span></div>' +
        '<button class="btn btn--ghost" id="btnDesconectarNube">Desconectar de la nube</button>'
      :
        '<p class="modalNote">Ahora mismo esta app guarda los datos ' + (window.storage ? 'dentro de este chat de Claude' : 'solo en este dispositivo') + '. Para que todo el equipo cargue desde su propio celular y vea lo mismo en tiempo real, conectá una base de datos gratuita (Firebase). Tardás unos 5 minutos.</p>' +
        (mostrarFormNube ?
          '<ol class="modalSteps">' +
            '<li>Entrá a <strong>console.firebase.google.com</strong> con una cuenta de Google.</li>' +
            '<li>Creá un proyecto (podés llamarlo "granja-ercilia"), sin habilitar Google Analytics.</li>' +
            '<li>En el menú izquierdo entrá a <strong>Compilación → Firestore Database</strong> y creá una base de datos, en <strong>modo de prueba</strong>.</li>' +
            '<li>Andá a <strong>Configuración del proyecto</strong> (ícono ⚙ arriba a la izquierda) → sección "Tus apps" → creá una app <strong>Web</strong> (ícono &lt;/&gt;), con cualquier nombre.</li>' +
            '<li>Copiá el objeto <code>firebaseConfig</code> que te muestra y pegalo acá abajo, tal cual.</li>' +
          '</ol>' +
          '<label class="field"><span>Configuración de Firebase (pegar el objeto firebaseConfig)</span><textarea id="p_cloudcfg" rows="6" placeholder=\'{ apiKey: "...", authDomain: "...", projectId: "...", ... }\'></textarea></label>' +
          '<button class="btn btn--secondary" id="btnConectarNube">Conectar</button>'
        : '<button class="btn btn--ghost" id="btnMostrarNube">Configurar sincronización en la nube</button>')
      ) +
      '<div class="divider"></div>' +
      '<h4 class="modalSubhead">Respaldo de datos</h4>' +
      '<p class="modalNote">Además de lo anterior, podés exportar en cualquier momento una copia manual de todos los registros.</p>' +
      '<div class="modalRow"><button class="btn btn--ghost" id="btnExportarRespaldo">Descargar copia (.json)</button>' +
      '<label class="btn btn--ghost" id="btnImportarRespaldo">Restaurar copia<input type="file" id="fileRespaldo" accept="application/json" hidden></label></div>' +
    '</div>';

  const btnMostrarNube = document.getElementById('btnMostrarNube');
  if (btnMostrarNube) btnMostrarNube.addEventListener('click', () => { mostrarFormNube = true; renderPerfilModal(); });
  const btnConectarNube = document.getElementById('btnConectarNube');
  if (btnConectarNube) btnConectarNube.addEventListener('click', async () => {
    const texto = document.getElementById('p_cloudcfg').value;
    const cfg = parseFirebaseConfigInput(texto);
    if (!cfg || !cfg.apiKey || !cfg.projectId) { toast('No pude leer esa configuración. Revisá que sea el objeto completo copiado de Firebase.'); return; }
    btnConectarNube.textContent = 'Conectando...'; btnConectarNube.disabled = true;
    try {
      await initCloud(cfg);
      saveCloudConfig(cfg);
      toast('¡Conectado! Sincronizando datos del equipo...');
      setTimeout(() => location.reload(), 600);
    } catch (e) {
      toast('No se pudo conectar. Revisá el modo de prueba de Firestore y que el texto esté completo.');
      btnConectarNube.textContent = 'Conectar'; btnConectarNube.disabled = false;
    }
  });
  const btnDesconectarNube = document.getElementById('btnDesconectarNube');
  if (btnDesconectarNube) btnDesconectarNube.addEventListener('click', () => {
    if (!confirm('Esto desconecta este dispositivo de la nube y vuelve al modo local. ¿Continuar?')) return;
    clearCloudConfig();
    location.reload();
  });

  document.getElementById('cerrarPerfil').addEventListener('click', cerrarPerfil);
  document.getElementById('guardarPerfil').addEventListener('click', async () => {
    state.perfil.nombre = document.getElementById('p_nombre').value.trim();
    state.perfil.rol = document.getElementById('p_rol').value;
    await storeSet('perfil', JSON.stringify(state.perfil), false);
    renderNav();
    if (!canAccess(state.activeTab)) setTab('inicio'); else renderCurrentView();
    toast('Perfil actualizado');
    cerrarPerfil();
  });
  document.getElementById('btnExportarRespaldo').addEventListener('click', () => {
    const data = JSON.stringify({ registros: state.registros, galpones: state.galpones, pedidos: state.pedidos, stock: state.stock, pesajes: state.pesajes, gastos: state.gastos, ventas: state.ventas, exportadoEn: new Date().toISOString() }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'granja-ercilia-respaldo_' + todayStr() + '.json';
    a.click();
  });
  document.getElementById('fileRespaldo').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (Array.isArray(data.registros) && Array.isArray(data.galpones)) {
        await restaurarDatos(data.registros, data.galpones, data.pedidos || [], data.stock || [], data.pesajes || [], data.gastos || [], data.ventas || []);
        toast('Respaldo restaurado ✓');
        cerrarPerfil();
        renderCurrentView();
      } else {
        toast('El archivo no parece un respaldo válido.');
      }
    } catch (err) { toast('Error al leer el respaldo'); }
  });
}

function abrirPerfil() {
  renderPerfilModal();
  document.getElementById('modalPerfil').classList.add('modal--open');
}
function cerrarPerfil() {
  document.getElementById('modalPerfil').classList.remove('modal--open');
}

/* ---------- Cargar datos iniciales ---------- */
async function cargarDatos() {
  const cfg = loadCloudConfig();
  if (cfg) {
    try {
      await initCloud(cfg);
      setupListeners();
    } catch (e) {
      console.warn('Error al iniciar Firebase con config guardada, volviendo a local:', e);
      clearCloudConfig();
      await cargarDatosLocales();
    }
  } else {
    await cargarDatosLocales();
  }

  const p = await storeGet('perfil', false);
  if (p) { try { state.perfil = Object.assign(state.perfil, JSON.parse(p)); } catch (e) {} }
  const mc = await storeGet('maplesConfig', false);
  if (mc) { try { state.maplesConfig = Object.assign(state.maplesConfig, JSON.parse(mc)); } catch (e) {} }
  const pr = await storeGet('precios', false);
  if (pr) { try { state.precios = Object.assign(state.precios, JSON.parse(pr)); } catch (e) {} }

  renderNav();
  setTab('inicio');
}

async function cargarDatosLocales() {
  const r = await storeGet('registros', true);
  if (r) { try { state.registros = JSON.parse(r); } catch (e) {} }
  const g = await storeGet('galpones', true);
  if (g) { try { state.galpones = JSON.parse(g); } catch (e) {} }
  const pd = await storeGet('pedidos', true);
  if (pd) { try { state.pedidos = JSON.parse(pd); } catch (e) {} }
  const st = await storeGet('stock', true);
  if (st) { try { state.stock = JSON.parse(st); } catch (e) {} }
  const ps = await storeGet('pesajes', true);
  if (ps) { try { state.pesajes = JSON.parse(ps); } catch (e) {} }
  const gt = await storeGet('gastos', true);
  if (gt) { try { state.gastos = JSON.parse(gt); } catch (e) {} }
  const vn = await storeGet('ventas', true);
  if (vn) { try { state.ventas = JSON.parse(vn); } catch (e) {} }
  if (!state.galpones.length) {
    state.galpones = [{ id: 'g_default', nombre: 'Galpón 1', capacidad: 0 }];
    await guardarGalponesLocal();
  }
}

/* Global error handler — muestra errores como toast para depuración */
window.onerror = function(msg, src, line, col, err) {
  console.error('Global error:', msg, src, line, col, err);
  try { toast('⚠ Error L' + line + ': ' + msg); } catch(e) {}
};
window.addEventListener('unhandledrejection', function(ev) {
  console.error('Unhandled promise:', ev.reason);
  try { toast('⚠ Async error: ' + (ev.reason && ev.reason.message || ev.reason)); } catch(e) {}
});

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btnPerfil').addEventListener('click', abrirPerfil);
  cargarDatos().catch(e => {
    console.error('Error al cargar datos:', e);
    try { toast('Error al cargar datos: ' + e.message); } catch(e2) {}
    try { renderNav(); setTab('inicio'); } catch(e2) { console.error('Fallback render failed:', e2); }
  });
});
</script>
